name: Linux Static Qt6

on:
  # push代码时触发workflow（分支上忽略文档改动；打 v* 标签时构建并上传到 Release）
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  # pull_request时触发workflow
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "BUILD.md"
  # 手动触发；可指定已有标签，把 Linux 二进制补传到对应 Release
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to upload the Linux binary to (leave empty for a normal build)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]

    name: Linux Static ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TZ: Asia/Shanghai
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install Build Essentials
        run: |
          sed -i 's|http://archive.ubuntu.com|http://ubuntu-archive-asm.trafficmanager.net|g' /etc/apt/sources.list
          sed -i 's|http://security.ubuntu.com|http://ubuntu-archive-asm.trafficmanager.net|g' /etc/apt/sources.list
          apt update
          apt install -y software-properties-common
          add-apt-repository ppa:savoury1/build-tools
          add-apt-repository ppa:savoury1/fonts
          add-apt-repository ppa:savoury1/backports
          add-apt-repository ppa:savoury1/python
          add-apt-repository ppa:savoury1/gcc-defaults-14
          apt update
          apt upgrade -y
          apt install -y build-essential git perl cmake ninja-build wget
      - name: Checking out sources
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Trust checkout in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build dependencies
        run: |
          apt update
          apt install -y build-essential ninja-build cmake pkgconf bash
          apt install -y libgl1-mesa-dev libglu1-mesa-dev
          apt install -y libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev  libxcb-xinerama0-dev libxkbcommon-dev libxkbcommon-x11-dev
          apt install -y libharfbuzz-dev libsm-dev libdrm-dev libwayland-dev
          apt install -y '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev
          apt install -y bubblewrap
      - name: Install Qt
        run: |
          cd ..
          wget https://github.com/Project-LemonLime/qt5ci/releases/latest/download/qt-6.12-static-linux.tar.gz
          tar -zxvf qt-6.12-static-linux.tar.gz
      - name: Prepare artifact name
        id: artifact_name
        uses: ./.github/actions/artifact-name
        with:
          platform: linux
          arch: x64
          build-type: ${{ matrix.build_type }}
          variant: ubuntu20.04
          qmake: ../qt6/bin/bin/qmake
      - name: Build
        run: |
          cd ..
          mkdir build
          cd build
          cmake ../Project_LemonLime -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLEMON_BUILD_INFO="Build for Linux" -DLEMON_BUILD_EXTRA_INFO="Build on $(uname -sr)" -DCMAKE_PREFIX_PATH=../qt6/bin -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build . --parallel $(nproc)
      - name: Run tests
        run: |
          ctest --test-dir ../build --output-on-failure --timeout 120
      - name: Package
        run: |
          cd ../build
          cmake --build . --target package --parallel $(nproc)
          cd ../Project_LemonLime
          cp ../build/lemon "${{ steps.artifact_name.outputs.name }}"
          tar -czf "${{ steps.artifact_name.outputs.name }}.tar.gz" "${{ steps.artifact_name.outputs.name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ steps.artifact_name.outputs.name }}.tar.gz
          archive: false
          if-no-files-found: error
      - name: Upload binaries to release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.artifact_name.outputs.name }}.tar.gz
          asset_name: ${{ steps.artifact_name.outputs.name }}.tar.gz
          tag: ${{ inputs.release_tag || github.ref_name }}
          overwrite: true
